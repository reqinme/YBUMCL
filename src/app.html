<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>延边大学我的世界启动器</title>
    <style>
      html,
      body {
        background: #0a0c11;
      }
      /* 输入框/文本域用的右键菜单，样式跟应用里其它浮层保持一致。 */
      .app-menu {
        position: fixed;
        z-index: 9999;
        min-width: 128px;
        padding: 4px;
        display: flex;
        flex-direction: column;
        background: rgb(28 30 32);
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 10px;
        box-shadow: 0 12px 32px rgb(0 0 0 / 0.45);
      }
      .app-menu button {
        background: none;
        border: 0;
        color: #e8eaed;
        font: inherit;
        font-size: 13px;
        line-height: 1.3;
        text-align: left;
        padding: 7px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .app-menu button:hover:not(:disabled) {
        background: rgb(255 255 255 / 0.08);
      }
      .app-menu button:disabled {
        color: #6b7075;
        cursor: default;
      }
      .app-menu .app-menu-hint {
        padding: 4px 10px 7px;
        font-size: 11px;
        color: #d8a657;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    %sveltekit.body%
    <script>
      // WebView2 自带的右键菜单带「刷新 / 另存为 / 打印」，在启动器里都不合适：
      // 输入框和文本域换成我们自己的（撤销/剪切/复制/粘贴/全选），其它地方一律不弹。
      // 已有的自绘右键（版本页文件夹列表、下载页收藏夹）在自己的处理函数里 preventDefault，
      // 这里只 preventDefault、不 stopPropagation，所以那两处照旧。
      (() => {
        const isEditable = (node) =>
          node instanceof HTMLElement &&
          (node.tagName === "INPUT" || node.tagName === "TEXTAREA" || node.isContentEditable);

        let menu = null;
        let target = null;

        function closeMenu() {
          if (menu) menu.remove();
          menu = null;
          target = null;
        }

        function hasSelection(node) {
          if (!node) return false;
          if (node.tagName === "INPUT" || node.tagName === "TEXTAREA") {
            return (node.selectionEnd ?? 0) !== (node.selectionStart ?? 0);
          }
          return String(window.getSelection() ?? "").length > 0;
        }

        function run(command) {
          const node = target;
          if (!node) return;
          node.focus();
          document.execCommand(command);
          closeMenu();
        }

        async function readClipboard() {
          try {
            const text = await window.__TAURI_INTERNALS__?.invoke(
              "plugin:clipboard-manager|read_text"
            );
            if (typeof text === "string") return text;
          } catch {
            /* 没权限或插件没起来，退回浏览器接口 */
          }
          try {
            return await navigator.clipboard.readText();
          } catch {
            return "";
          }
        }

        async function paste() {
          const node = target;
          if (!node) return;
          const text = await readClipboard();
          if (!text) {
            closeMenu();
            flash(node, "剪贴板里没有可粘贴的文字，按 Ctrl+V 试试");
            return;
          }
          node.focus();
          if (node.tagName === "INPUT" || node.tagName === "TEXTAREA") {
            const start = node.selectionStart ?? node.value.length;
            const end = node.selectionEnd ?? start;
            node.setRangeText(text, start, end, "end");
            // setRangeText 不触发事件，绑定的值是靠 input 事件同步的。
            node.dispatchEvent(new Event("input", { bubbles: true }));
          } else {
            document.execCommand("insertText", false, text);
          }
          closeMenu();
        }

        function flash(node, message) {
          const hint = document.createElement("div");
          hint.className = "app-menu app-menu-hint";
          hint.textContent = message;
          hint.style.left = `${Math.max(8, node.getBoundingClientRect().left)}px`;
          hint.style.top = `${Math.max(8, node.getBoundingClientRect().top - 34)}px`;
          document.body.appendChild(hint);
          setTimeout(() => hint.remove(), 2000);
        }

        function openMenu(event, node) {
          closeMenu();
          target = node;
          node.focus();
          const selected = hasSelection(node);
          const entries = [
            ["撤销", () => run("undo"), true],
            ["剪切", () => run("cut"), selected],
            ["复制", () => run("copy"), selected],
            ["粘贴", () => void paste(), true],
            ["全选", () => run("selectAll"), true]
          ];
          menu = document.createElement("div");
          menu.className = "app-menu";
          for (const [label, handler, enabled] of entries) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;
            button.disabled = !enabled;
            button.addEventListener("click", (clickEvent) => {
              clickEvent.preventDefault();
              handler();
            });
            menu.appendChild(button);
          }
          menu.style.left = `${event.clientX}px`;
          menu.style.top = `${event.clientY}px`;
          document.body.appendChild(menu);
          const rect = menu.getBoundingClientRect();
          menu.style.left = `${Math.max(8, Math.min(event.clientX, window.innerWidth - rect.width - 8))}px`;
          menu.style.top = `${Math.max(8, Math.min(event.clientY, window.innerHeight - rect.height - 8))}px`;
        }

        window.addEventListener(
          "contextmenu",
          (event) => {
            event.preventDefault();
            if (isEditable(event.target)) {
              openMenu(event, event.target);
            } else {
              closeMenu();
            }
          },
          true
        );

        window.addEventListener("pointerdown", (event) => {
          if (menu && !menu.contains(event.target)) closeMenu();
        }, true);
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeMenu();
        }, true);
        window.addEventListener("blur", closeMenu);
        window.addEventListener("resize", closeMenu);
        window.addEventListener("scroll", closeMenu, true);
      })();
    </script>
  </body>
</html>
